<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | AlumniConnect</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .phone-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        #countryCode {
            width: 115px;
            min-width: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        #phone {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AlumniConnect</h1>
        <h2>Student Registration</h2>
        <p>Create your account to connect with alumni and mentors.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                pattern="[A-Za-z ]{2,100}"
                maxlength="100"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>

            <div class="phone-group">
                <select id="countryCode" name="countryCode" required>
                    <option value="+91" selected>🇮🇳 +91</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+971">🇦🇪 +971</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+65">🇸🇬 +65</option>
                    <option value="+60">🇲🇾 +60</option>
                    <option value="+94">🇱🇰 +94</option>
                    <option value="+977">🇳🇵 +977</option>
                    <option value="+880">🇧🇩 +880</option>
                    <option value="+966">🇸🇦 +966</option>
                    <option value="+974">🇶🇦 +974</option>
                    <option value="+49">🇩🇪 +49</option>
                    <option value="+33">🇫🇷 +33</option>
                    <option value="+81">🇯🇵 +81</option>
                </select>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="10-digit number"
                    maxlength="10"
                    minlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"
                    title="Enter exactly 10 digits"
                    required
                >
            </div>

            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="IT">Information Technology</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="ECE">Electronics and Communication Engineering</option>
                <option value="EEE">Electrical and Electronics Engineering</option>
                <option value="ME">Mechanical Engineering</option>
                <option value="CE">Civil Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label for="year">Current Year</label>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>

            <label for="interests">Career Interests</label>
            <textarea
                id="interests"
                name="interests"
                placeholder="e.g. Web Development, AI, Networking"
            ></textarea>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter exactly 8 characters"
                minlength="8"
                maxlength="8"
                required
            >

            <button type="submit">Register</button>

            <p id="message" role="status"></p>
        </form>

        <p>Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <a href="index.html">Back to Home</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
